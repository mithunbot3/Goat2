name: 🐐 MITHUN GOAT BOT • Node 20

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: 🐐 MITHUN GOAT BOT Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📥 CHECKOUT
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧰 NODE SETUP
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🧰 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 📦 DEPENDENCIES
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 📦 Install Packages
        run: |
          echo "📦 Installing Dependencies..."
          npm install
          npm install request-promise --save
          echo "✅ Installation Complete"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🚀 START BOT
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🚀 Launch MITHUN GOAT BOT
        env:
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          FB_COOKIE: ${{ secrets.FB_COOKIE }}
        run: |
          printf '\033[1;36m'
          cat <<'EOF'

          ███╗   ███╗██╗████████╗██╗  ██╗██╗   ██╗███╗   ██╗
          ████╗ ████║██║╚══██╔══╝██║  ██║██║   ██║████╗  ██║
          ██╔████╔██║██║   ██║   ███████║██║   ██║██╔██╗ ██║
          ██║╚██╔╝██║██║   ██║   ██╔══██║██║   ██║██║╚██╗██║
          ██║ ╚═╝ ██║██║   ██║   ██║  ██║╚██████╔╝██║ ╚████║
          ╚═╝     ╚═╝╚═╝   ╚═╝   ╚═╝  ╚═╝ ╚═════╝ ╚═╝  ╚═══╝

           ██████╗  ██████╗  █████╗ ████████╗    ██████╗  ██████╗ ████████╗
          ██╔════╝ ██╔═══██╗██╔══██╗╚══██╔══╝    ██╔══██╗██╔═══██╗╚══██╔══╝
          ██║  ███╗██║   ██║███████║   ██║       ██████╔╝██║   ██║   ██║
          ██║   ██║██║   ██║██╔══██║   ██║       ██╔══██╗██║   ██║   ██║
          ╚██████╔╝╚██████╔╝██║  ██║   ██║       ██████╔╝╚██████╔╝   ██║
           ╚═════╝  ╚═════╝ ╚═╝  ╚═╝   ╚═╝       ╚═════╝  ╚═════╝    ╚═╝

          EOF
          printf '\033[0m'
          printf '\033[1m🐐 STARTING MITHUN GOAT BOT\033[0m\n\n'

          while true
          do
            node index.js
            echo ""
            echo "⚠️ Bot stopped — restarting in 5 seconds..."
            sleep 5
          done

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 🧹 CLEANUP
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: 🧹 Cleanup Runner
        if: always()
        run: |
          echo "✅ Job Finished"
          echo "🧹 Cleaning temporary environment..."
